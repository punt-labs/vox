name: Live speech roundtrip

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate-artifact:
        description: Wheel and sdist artifact from this release run (empty for nightly)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  roundtrip-live:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      HF_HUB_CACHE: ${{ github.workspace }}/.hf-cache
      VOX_ROUNDTRIP_REQUIRE_LIVE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - &download-candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.candidate-artifact != ''
        with:
          name: ${{ inputs.candidate-artifact }}
          path: candidate/
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng ripgrep mpv
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HF_HUB_CACHE }}
          key: whisper-small-en-${{ runner.os }}-d1d751a5-v1
      - &install-subject
        name: Install test dependencies and subject
        env:
          CANDIDATE_ARTIFACT: ${{ inputs.candidate-artifact }}
        run: |
          if [[ -z "$CANDIDATE_ARTIFACT" ]]; then
            export UV_PROJECT_ENVIRONMENT="$PWD/.venv"
            uv sync --frozen --all-extras --group roundtrip
          else
            export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/vox-candidate-venv"
            uv sync --frozen --all-extras --group roundtrip --no-install-project
            uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" --no-deps candidate/*.whl
          fi
          printf 'UV_PROJECT_ENVIRONMENT=%s\n' "$UV_PROJECT_ENVIRONMENT" >> "$GITHUB_ENV"
      - name: Installed candidate CLI and MCP
        if: inputs.candidate-artifact != ''
        run: |
          export VOX_E2E_BINARY="$UV_PROJECT_ENVIRONMENT/bin/vox"
          test -x "$VOX_E2E_BINARY"
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest tests/e2e -m e2e
      - name: Live speech roundtrip
        # Do not use uv run: it can sync the editable checkout over the wheel.
        run: |
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest tests/roundtrip -m 'roundtrip and integration' -s
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Chime and music signal levels
        if: ${{ !cancelled() }}
        run: |
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest tests/levels -m levels -s --basetemp="$RUNNER_TEMP/levels"
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOX_LEVELS_REQUIRE_LIVE: "1"
      - name: Upload measured audio
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: levels-audio
          path: ${{ runner.temp }}/levels/**/*.*
          if-no-files-found: ignore
          retention-days: 14

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_CACHE: ${{ github.workspace }}/.hf-cache
      VOX_AGENT_REQUIRE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - *download-candidate
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng mpv
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HF_HUB_CACHE }}
          key: whisper-small-en-${{ runner.os }}-d1d751a5-v1
      - name: Install Claude Code
        run: |
          npm install --global --prefix "$RUNNER_TEMP/claude-code" @anthropic-ai/claude-code@2.1.330
          printf '%s\n' "$RUNNER_TEMP/claude-code/bin" >> "$GITHUB_PATH"
      - *install-subject
      - name: Agent speech roundtrip
        # Keep vox and voxd from the selected test subject, including an installed RC wheel.
        run: |
          export PATH="$UV_PROJECT_ENVIRONMENT/bin:$PATH"
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest tests/roundtrip -m agent -s
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  report-failure:
    needs: [roundtrip-live, agent]
    if: failure() && inputs.candidate-artifact == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      PROVIDER_RESULT: ${{ needs.roundtrip-live.result }}
      AGENT_RESULT: ${{ needs.agent.result }}
    steps:
      - name: File a Linear issue for the failed suite
        run: |
          node --input-type=module <<'JS'
          const { LINEAR_API_KEY, GITHUB_SERVER_URL, GITHUB_REPOSITORY, GITHUB_RUN_ID,
            PROVIDER_RESULT, AGENT_RESULT } = process.env;
          if (!LINEAR_API_KEY) throw new Error('Set LINEAR_API_KEY to report nightly failures');
          const teamId = 'c1dfbb2c-985e-40cf-b004-5127646efc9d';
          const labels = ['repo:vox', 'Bug'];
          async function linear(query, variables) {
            const response = await fetch('https://api.linear.app/graphql', {
              method: 'POST',
              headers: { Authorization: LINEAR_API_KEY, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, variables }),
              signal: AbortSignal.timeout(15_000),
            });
            if (!response.ok) throw new Error(`Linear returned HTTP ${response.status}`);
            const { data, errors } = await response.json();
            if (errors?.length) throw new Error(errors.map(error => error.message).join('; '));
            return data;
          }
          const { issueLabels } = await linear(`query($names: [String!]!) {
            issueLabels(filter: { name: { in: $names } }) { nodes { id name team { id } } }
          }`, { names: labels });
          const labelIds = labels.map(name => {
            const candidates = issueLabels.nodes.filter(label => label.name === name);
            const label = candidates.find(label => label.team?.id === teamId)
              ?? candidates.find(label => !label.team);
            if (!label) throw new Error(`Linear label not found: ${name}`);
            return label.id;
          });
          const { issueCreate } = await linear(`mutation($input: IssueCreateInput!) {
            issueCreate(input: $input) { success issue { url } }
          }`, { input: {
            teamId, labelIds, priority: 3,
            title: 'Vox live speech suite failed',
            description: `Provider round-trip: ${PROVIDER_RESULT}\nAgent round-trip: ${AGENT_RESULT}\n\n`
              + `[Actions run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})`,
          } });
          if (!issueCreate.success) throw new Error('Linear did not create the issue');
          console.log(issueCreate.issue.url);
          JS
