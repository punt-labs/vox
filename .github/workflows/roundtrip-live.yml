name: Live speech roundtrip

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate-artifact:
        description: Wheel and sdist artifact from this release run (empty for nightly)
        type: string
        default: ""
    secrets:
      ELEVENLABS_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_SESSION_TOKEN:
        required: false
      AWS_DEFAULT_REGION:
        required: false

permissions:
  contents: read

jobs:
  roundtrip-live:
    name: Live speech (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      HF_HUB_CACHE: ${{ github.workspace }}/.hf-cache
      VOX_ROUNDTRIP_REQUIRE_LIVE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.candidate-artifact != ''
        with:
          name: ${{ inputs.candidate-artifact }}
          path: candidate/
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng ripgrep
        if: runner.os == 'Linux'
      - run: command -v ffmpeg || brew install ffmpeg
        if: runner.os == 'macOS'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HF_HUB_CACHE }}
          key: whisper-small-en-${{ runner.os }}-d1d751a5-v1
      - name: Install test dependencies and subject
        id: dependencies
        env:
          CANDIDATE_ARTIFACT: ${{ inputs.candidate-artifact }}
        run: |
          if [[ -z "$CANDIDATE_ARTIFACT" ]]; then
            export UV_PROJECT_ENVIRONMENT="$PWD/.venv"
            uv sync --frozen --all-extras --group roundtrip
          else
            export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/vox-candidate-venv"
            uv sync --frozen --all-extras --group roundtrip --no-install-project
            uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" --no-deps candidate/*.whl
          fi
          printf 'UV_PROJECT_ENVIRONMENT=%s\n' "$UV_PROJECT_ENVIRONMENT" >> "$GITHUB_ENV"
      - name: Installed candidate CLI and MCP
        if: runner.os == 'Linux' && inputs.candidate-artifact != ''
        run: |
          export VOX_E2E_BINARY="$UV_PROJECT_ENVIRONMENT/bin/vox"
          test -x "$VOX_E2E_BINARY"
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest tests/e2e -m e2e
      # Use the selected interpreter directly: uv run can replace the candidate wheel.
      - name: espeak-ng to Whisper
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest tests/roundtrip/test_offline.py -m roundtrip -s
      - name: Cloud credential rejection
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest tests/roundtrip/test_live_auth.py -m integration
      - name: ElevenLabs, OpenAI, and Polly to Whisper and Scribe
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest tests/roundtrip/test_live.py -m 'roundtrip and integration' -s
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: macOS Say to Whisper
        if: runner.os == 'macOS'
        run: |
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest tests/roundtrip/test_say_roundtrip.py -m 'roundtrip and integration' -s
