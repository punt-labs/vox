name: Live speech roundtrip

on:
  workflow_dispatch:

permissions: {}

jobs:
  linear-viewer:
    name: Verify Linear key (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Linear viewer
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          const { LINEAR_API_KEY } = process.env;
          if (!LINEAR_API_KEY) throw new Error('LINEAR_API_KEY is not available to this runner');
          const response = await fetch('https://api.linear.app/graphql', {
            method: 'POST',
            headers: { Authorization: LINEAR_API_KEY, 'Content-Type': 'application/json' },
            signal: AbortSignal.timeout(20_000),
            body: JSON.stringify({ query: 'query VerifyActionsKey { viewer { id } }' }),
          });
          if (!response.ok) throw new Error('Linear viewer query returned HTTP ' + response.status);
          const result = await response.json();
          if (result.errors?.length || !result.data?.viewer?.id) {
            throw new Error('Linear did not return an authenticated viewer');
          }
          console.log('Linear accepted the Actions key and returned an authenticated viewer; no issue was created.');
          JS
