name: Handoff runtime

on:
  pull_request:
    paths:
      - .github/workflows/handoff-runtime.yml
      - .punt-labs/ethos/checks/snapshots/vox-python.yaml
      - .python-version
      - Makefile
      - pyproject.toml
      - scripts/*handoff-runtime.sh
      - uv.lock
  workflow_dispatch:
    inputs:
      tag:
        description: New runtime release tag, e.g. handoff-runtime-v1
        required: true
        type: string

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
            shellcheck-platform: linux.x86_64
            shellcheck-sha: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
          - runner: macos-15
            platform: darwin-arm64
            shellcheck-platform: darwin.aarch64
            shellcheck-sha: 339b930feb1ea764467013cc1f72d09cd6b869ebf1013296ba9055ab2ffbd26f
    steps:
      - name: Validate runtime release request
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || ! "$TAG" =~ ^handoff-runtime-v[1-9][0-9]*$ ]]; then
            echo 'Dispatch on main with a new handoff-runtime-vN tag.' >&2
            exit 2
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - if: runner.os == 'macOS'
        run: brew install gnu-tar
      - name: Install upstream ShellCheck
        env:
          SHELLCHECK_PLATFORM: ${{ matrix.shellcheck-platform }}
          SHELLCHECK_SHA: ${{ matrix.shellcheck-sha }}
        run: |
          cd "$RUNNER_TEMP"
          asset="shellcheck-v0.11.0.$SHELLCHECK_PLATFORM.tar.gz"
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error \
            --connect-timeout 15 --max-time 180 --location --output "$asset" \
            "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/$asset"
          printf '%s  %s\n' "$SHELLCHECK_SHA" "$asset" | shasum -a 256 --check
          tar -xzf "$asset"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Package the offline runtime
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir runtime-assets
          archive=$(scripts/build-handoff-runtime.sh runtime-assets)
          sha=$(basename "$archive" .tar.gz)
          asset="vox-handoff-$PLATFORM.tar.gz"
          mv "$archive" "runtime-assets/$asset"
          printf '%s  %s\n' "$sha" "$asset" | tee "runtime-assets/$asset.sha256"
      - name: Smoke-test the relocated toolchain offline
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          mkdir "$scratch/runtime" "$scratch/home" "$scratch/tmp"
          tar -xzf "runtime-assets/vox-handoff-$PLATFORM.tar.gz" -C "$scratch/runtime"
          runtime="$scratch/runtime"
          cp -R "$runtime/cache/uv" "$scratch/uv-cache"
          cp -R "$runtime/cache/npm" "$scratch/npm-cache"
          if [[ $RUNNER_OS == Linux ]]; then
            offline=(sudo unshare --net --setuid "$(id -u)" --setgid "$(id -g)" --)
          else
            offline=(sandbox-exec -p '(version 1) (allow default) (deny network*)')
          fi
          "${offline[@]}" env -i HOME="$scratch/home" TMPDIR="$scratch/tmp" \
            PATH="$runtime/bin:$runtime/node/bin:/usr/bin:/bin" \
            UV_PYTHON="$runtime/python/bin/python3" \
            UV_OFFLINE=1 UV_PYTHON_DOWNLOADS=never UV_LINK_MODE=copy \
            UV_CACHE_DIR="$scratch/uv-cache" UV_PROJECT_ENVIRONMENT="$scratch/venv" \
            PYTHONDONTWRITEBYTECODE=1 npm_config_update_notifier=false \
            npm_config_cache="$scratch/npm-cache" npm_config_offline=true \
            bash -e -c 'uv sync --offline --locked --group docs && make docs && uv run pyright --version && shellcheck --version'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: runtime-assets/
          compression-level: 0
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    concurrency: handoff-runtime-release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          path: runtime-assets
          merge-multiple: true
      - name: Publish content-addressed runtime assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^handoff-runtime-v[1-9][0-9]*$ ]] || { echo 'Invalid runtime tag' >&2; exit 2; }
          cd runtime-assets
          sha256sum --check vox-handoff-linux-amd64.tar.gz.sha256 vox-handoff-darwin-arm64.tar.gz.sha256
          gh release create "$TAG" ./*.tar.gz ./*.sha256 --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --draft --prerelease --latest=false \
            --title "Vox handoff runtime $TAG" --notes-file - <<'NOTES'
          Offline toolchains for the Vox Ethos handoff gate.

          Upstream tool sources: [ShellCheck](https://github.com/koalaman/shellcheck/tree/v0.11.0),
          [uv](https://github.com/astral-sh/uv/tree/0.13.9),
          [Python](https://github.com/python/cpython),
          [Node.js](https://github.com/nodejs/node/tree/v24.22.3).
          NOTES
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
