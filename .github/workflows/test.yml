name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # ffmpeg (pydub's codec backend) and espeak-ng (the Linux provider). The
  # apt cache key hashes this string, so editing it starts a fresh cache.
  VOX_APT_PACKAGES: ffmpeg espeak-ng
  # Runner-owned apt state (archives + package lists) that actions/cache can
  # tar and untar without root. The default /var/cache/apt/archives and
  # /var/lib/apt/lists hold root-only lock files and a 0700 _apt partial/
  # directory that the cache action, running as `runner`, cannot read.
  VOX_APT_DIR: /var/cache/vox-ci-apt

jobs:
  test:
    runs-on: ubuntu-latest
    # 22m = 17m of apt step ceilings (1m prepare + 2m restore + 12m install
    # + 2m save) + 5m for the rest of the job. Healthy runs take 3-5 min end
    # to end (October 2026: 182-282 s, of which apt is 16-62 s), so the
    # non-apt steps take at most 282 - 16 = 266 s (~4.4 min), inside the 5m
    # allowance; the two pytest invocations (default tier, then
    # slow/subprocess -- see TESTING.md, "Why the Suite Takes as Long as It
    # Does") are ~3.5 min of that. 22m is also above
    # the 20m test-job default in punt-kit/standards/github.md.
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Install $VOX_APT_PACKAGES: four steps, defined once here and aliased
      # into packaging-e2e, so both jobs install the same set the same way.
      #
      # Why: a healthy install takes 16-62 s, but in 13 of 78 job runs
      # (October 2026) azure.archive.ubuntu.com served the ~70 MB of .debs at
      # ~40 KB/s, and the step crawled to 2-19 min or was killed by the job
      # timeout. The slow mirror is per-runner, not global -- the other job
      # in the same run usually finished normally.
      #
      # 1. apt-prepare: create $VOX_APT_DIR (runner-owned), point apt at it
      #    for both archives and lists, confine apt's sources to the image's
      #    Ubuntu archive + security file, and compute the cache key
      #      apt-v2-<ImageOS>-<arch>-<sha256(packages, flags, sources)[:16]>-<ImageVersion>
      #    The runner image is in the key because the lists and .debs must
      #    resolve against that image's installed package set; the sources
      #    file is hashed because the lists are fetched from exactly it.
      #    The image also ships third-party sources (packages.microsoft.com
      #    and others) that ffmpeg and espeak-ng never come from. Confining
      #    every apt-get call in the job to Ubuntu's sources means a broken
      #    third-party repo cannot fail `update --error-on=any` below, and
      #    the lists, the download, the install, and autoclean all read the
      #    same source set. A missing Ubuntu sources file fails the step.
      # 2. apt-restore: warm cache (exact key) restores the lists and every
      #    .deb, so the install below skips `apt-get update` and apt reports
      #    "Need to get 0 B" -- no mirror contact at all. A new runner image
      #    misses the exact key and falls back to the newest cache for the
      #    same package set (restore-keys); apt then refreshes the lists and
      #    downloads only the .debs whose version changed.
      # 3. apt-install: bounded, retried download + local install. The
      #    download (network, safe to kill) is split from the install (dpkg,
      #    local, never killed mid-unpack, so a retry cannot hit an
      #    interrupted dpkg database). `apt-get update --error-on=any` makes
      #    a failed index fetch a non-zero exit, so it retries instead of
      #    leaving stale lists to be saved under a new key. Each attempt is
      #    capped at 60 s (update) + 90 s (fetch), each with a 10 s KILL
      #    grace; finished and partial .debs survive in $VOX_APT_DIR, so a
      #    retry resumes. Worst case for the download loop:
      #      3 x ((60 + 10) + (90 + 10)) + 10 + 20 (backoff) = 540 s = 9 min
      #    The final install runs with --no-download, so it can only use
      #    the local .debs and fails at once on any gap. If the restore step
      #    failed or timed out, whatever it half-extracted is discarded
      #    first. The step then checks that ffmpeg and espeak-ng run.
      # 4. apt-save: on any non-exact hit, save the refreshed lists + .debs
      #    under the exact key right away, so a later failing test step does
      #    not cost the next run its cache. When test and packaging-e2e both
      #    miss, one save wins and the other logs a non-fatal warning.
      #
      # The cache steps are best-effort: restore and save are bounded at 2
      # min and continue-on-error, so a cache-service outage degrades to the
      # cold path instead of failing the job.
      #
      # --no-install-recommends drops ~31 MB of the ~99 MB download
      # (pocketsphinx-en-us at 27 MB, plus VA-API/VDPAU GPU drivers) that
      # neither ffmpeg's audio path nor espeak-ng uses.
      - &apt-prepare
        name: Prepare apt cache directory and key
        id: apt-prepare
        timeout-minutes: 1
        run: |
          set -euo pipefail
          : "${ImageOS:?runner image name unset}" "${ImageVersion:?runner image version unset}"
          # The image's deb822 file for Ubuntu's archive and security
          # pockets (ubuntu-24.04). No fallback to the full source set.
          ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
          if [ ! -s "$ubuntu_sources" ]; then
            echo "::error::${ubuntu_sources} is missing or empty; cannot confine apt to the Ubuntu sources"
            exit 1
          fi
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 \
            "$VOX_APT_DIR" "$VOX_APT_DIR/archives" "$VOX_APT_DIR/lists" \
            "$VOX_APT_DIR/sources.list.d"
          # Not cached: rebuilt from the image every run.
          install -m 0644 "$ubuntu_sources" "$VOX_APT_DIR/sources.list.d/ubuntu.sources"
          # Every apt-get invocation in this job reads its state from here.
          # SourceList /dev/null drops the one-line sources.list; SourceParts
          # replaces /etc/apt/sources.list.d with the Ubuntu-only copy.
          # Keep-Downloaded-Packages is apt-get's default; stated because the
          # cache depends on it.
          printf '%s\n' \
            "Dir::Cache::Archives \"$VOX_APT_DIR/archives\";" \
            "Dir::State::Lists \"$VOX_APT_DIR/lists\";" \
            'Dir::Etc::SourceList "/dev/null";' \
            "Dir::Etc::SourceParts \"$VOX_APT_DIR/sources.list.d\";" \
            'APT::Keep-Downloaded-Packages "true";' |
            sudo tee /etc/apt/apt.conf.d/99vox-ci-cache >/dev/null
          pkg_hash=$({
            printf '%s\n' "$VOX_APT_PACKAGES" --no-install-recommends
            cat "$ubuntu_sources"
          } | sha256sum | cut -c1-16)
          prefix="apt-v2-${ImageOS}-${RUNNER_ARCH}-${pkg_hash}-"
          echo "restore-prefix=${prefix}" >>"$GITHUB_OUTPUT"
          echo "key=${prefix}${ImageVersion}" >>"$GITHUB_OUTPUT"
          echo "apt cache key: ${prefix}${ImageVersion}"
      - &apt-restore
        name: Restore apt cache
        id: apt-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        env:
          # The action's default per-segment download timeout is 10 min.
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          # Globs skip apt's root-only lock files and the _apt partial/ dirs.
          # Anchored here, aliased by apt-save: one path list for both.
          path: &apt-cache-paths |
            ${{ env.VOX_APT_DIR }}/archives/*.deb
            ${{ env.VOX_APT_DIR }}/lists/*_*
          key: ${{ steps.apt-prepare.outputs.key }}
          restore-keys: ${{ steps.apt-prepare.outputs.restore-prefix }}
      - &apt-install
        name: Install ffmpeg and espeak-ng (cached, bounded, retried)
        # 12m = the 9 min (540 s) download worst case above + 3 min for the
        # local dpkg install, autoclean, and the binary checks (16-62 s on
        # healthy runs, download included).
        timeout-minutes: 12
        env:
          APT_CACHE_HIT: ${{ steps.apt-restore.outputs.cache-hit }}
          # outcome, not conclusion: continue-on-error turns a failed or
          # timed-out restore's conclusion into success.
          APT_RESTORE_OUTCOME: ${{ steps.apt-restore.outcome }}
        run: |
          set -euo pipefail
          read -ra packages <<<"$VOX_APT_PACKAGES"
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::VOX_APT_PACKAGES is empty; nothing to install"
            exit 1
          fi
          # timeout(1) exits 124 when it sends TERM, and 137 (128 + KILL)
          # when the command outlives the -k grace and is killed.
          describe_rc() {
            case "$1" in
              124) echo "exit 124, timed out" ;;
              137) echo "exit 137, killed 10 s after timing out" ;;
              *) echo "exit $1" ;;
            esac
          }
          skip_update=false
          if [ "$APT_RESTORE_OUTCOME" != "success" ]; then
            # A restore killed mid-extract can leave truncated .debs and
            # lists; apt would trust them. Start from an empty cache.
            echo "::warning::apt cache restore ended '${APT_RESTORE_OUTCOME}'; discarding restored .debs and lists"
            find "$VOX_APT_DIR/archives" -maxdepth 1 -type f -name '*.deb' -delete
            find "$VOX_APT_DIR/lists" -maxdepth 1 -type f -name '*_*' -delete
          elif [ "$APT_CACHE_HIT" = "true" ]; then
            # Exact cache hit: the restored lists match this runner image, so
            # the first attempt goes straight to the (0 B) download.
            skip_update=true
          fi
          # Idle-connection timeout 30 s (apt default 120 s); per-item retries.
          apt_opts=(-o Acquire::http::Timeout=30 -o Acquire::Retries=3)
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            echo "apt download attempt ${attempt}/${attempts}"
            rc=0
            # A failed attempt refreshes the lists like a cold cache.
            if [ "$skip_update" = "true" ] && [ "$attempt" -eq 1 ]; then
              echo "apt cache hit: skipping apt-get update"
            else
              # --error-on=any: a failed index fetch is an error, not a
              # warning over the old lists. Only the Ubuntu sources are
              # configured (apt-prepare), so only they can fail it.
              sudo timeout -k 10 60 apt-get "${apt_opts[@]}" update --error-on=any || rc=$?
            fi
            if [ "$rc" -eq 0 ]; then
              sudo timeout -k 10 90 apt-get "${apt_opts[@]}" install -y \
                --no-install-recommends --download-only "${packages[@]}" || rc=$?
            fi
            if [ "$rc" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              echo "::error::apt download failed after ${attempts} attempts (last: $(describe_rc "$rc"))"
              exit 1
            fi
            delay=$((attempt * 10))
            echo "::warning::apt download attempt ${attempt}/${attempts} failed ($(describe_rc "$rc")); retrying in ${delay}s"
            sleep "$delay"
          done
          # --no-download: install only from the .debs fetched above; a
          # missing one fails here with apt's own message instead of a
          # silent, unbounded fetch from the mirror.
          sudo apt-get install -y --no-install-recommends --no-download "${packages[@]}"
          # Drop .debs the current lists no longer reference, so a cache
          # carried across runner images does not accumulate old versions.
          sudo apt-get autoclean
          # The binaries the test suites call. The step name and these
          # checks follow VOX_APT_PACKAGES; edit all three together.
          for check in "ffmpeg -version" "espeak-ng --version"; do
            read -ra cmd <<<"$check"
            if ! out=$("${cmd[@]}" 2>&1); then
              echo "::error::'${check}' failed after install: ${out}"
              exit 1
            fi
            echo "${check}: ${out%%$'\n'*}"
          done
      - &apt-save
        name: Save apt cache
        if: steps.apt-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: *apt-cache-paths
          key: ${{ steps.apt-prepare.outputs.key }}
      - run: uv sync --frozen --all-extras
      - run: uv run pytest
      # slow + subprocess were folded into the unmarked default run before
      # this taxonomy existed; run them explicitly so marking them opt-in
      # locally does not silently drop them from CI coverage.
      - run: uv run pytest -m "slow or subprocess"

  # Packaging e2e: drive the INSTALLED wheel -- the `vox` binary as a
  # subprocess and the `vox mcp` server over stdio. This job catches packaging
  # faults (an entry point that does not resolve, a module missing from the
  # wheel, an MCP server that fails to start over stdio) which the in-process
  # pytest above cannot see. Kept in its own job so a packaging break does not
  # mask a unit-test failure and vice versa.
  #
  # NOTE: distinct from the "Tier 5" designation in
  # tests/conversation_mode/coverage-matrix.md, which names live-audio /
  # human-judged testing. This is installed-wheel packaging smoke.
  packaging-e2e:
    runs-on: ubuntu-latest
    # 20m = 17m of apt step ceilings (1m prepare + 2m restore + 12m install
    # + 2m save) + 3m for the rest of the job; healthy runs take under 1.5
    # min end to end (October 2026: 37-75 s, apt included).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # The same apt steps as the unit job (YAML aliases), so `vox doctor`
      # reports the same environment the packaged binary is expected to run
      # against. Both jobs share one cache key.
      - *apt-prepare
      - *apt-restore
      - *apt-install
      - *apt-save
      - run: uv sync --frozen --all-extras
      # `make install` builds the wheel and does `uv tool install --force
      # dist/*.whl`; uv drops the console script in `$HOME/.local/bin` by
      # default. That directory is NOT on PATH in non-interactive Actions
      # shells until we publish it, and the e2e tests resolve the binary at
      # that path explicitly (see tests/e2e/test_installed_cli._vox) so a
      # `uv run pytest` invocation cannot mask the wheel with the editable
      # `.venv/bin/vox` shim.
      - run: make install
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: vox version
      - run: make test-e2e
