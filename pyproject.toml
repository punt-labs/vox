[project]
name = "punt-vox"
version = "5.1.0"
description = "Text-to-speech CLI, MCP server, and Claude Code plugin (ElevenLabs, AWS Polly, OpenAI)"
readme = "README.md"
authors = [{ name = "Punt Labs", email = "hello@punt-labs.com" }]
requires-python = ">=3.13"
license = "MIT"
keywords = [
    "tts",
    "vox",
    "text-to-speech",
    "mcp",
    "elevenlabs",
    "aws-polly",
    "openai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "punt-observe==0.1.1",
    # Security floor only: vox does not import authlib (it arrives through
    # punt-lux -> fastmcp). authlib < 1.9.1 is covered by Dependabot alerts
    # #61-#68; the floor keeps a PyPI install, which ignores uv.lock, off them.
    "authlib>=1.9.1",
    "boto3>=1.35.0",
    "boto3-stubs[polly]>=1.35.0",
    "botocore-stubs>=1.35.0",
    # Security floor only: vox does not import dnspython (it arrives through
    # pydantic[email] -> email-validator). dnspython < 2.9.0 is covered by
    # Dependabot alert #69; the floor keeps a PyPI install off it.
    "dnspython>=2.9.0",
    "elevenlabs>=2.0.0",
    # vox does not import fastmcp (punt-lux pulls it in with fastmcp>=3.0.0,<4).
    # The floor is a security floor: Dependabot alert #60 covers fastmcp
    # >=3.0.0,<3.4.10. The <4 cap tracks the mcp<2 cap below: fastmcp 4.x requires
    # mcp 2.x, which removed the mcp.server.fastmcp API the server imports.
    "fastmcp>=3.4.10,<4",
    # Imported directly, not just through the SDKs: the providers classify
    # httpx's own transport errors (ConnectError, ProxyError, UnsupportedProtocol)
    # that the ElevenLabs SDK lets escape raw. Floors are the locked versions.
    "httpx>=0.28.1",
    # The OpenAI SDK rides on httpx2, httpx's fork, whose error classes are
    # distinct types: classifying OpenAI's transport faults needs them by name.
    "httpx2>=2.14.0",
    # Security floor only: vox does not import joserfc (it arrives through
    # punt-lux -> fastmcp -> fastmcp-slim, both via authlib and directly from
    # fastmcp-slim's server extra). joserfc < 1.7.6 is covered by Dependabot
    # alerts #70 (JWE recipients CPU DoS, patched in 1.7.5) and #71 (compact JWS
    # size guard allocating attacker-controlled segments before rejecting them,
    # patched in 1.7.6); the floor keeps a PyPI install off them.
    "joserfc>=1.7.6",
    "markdown-it-py>=4.0.0",
    # Keep this floor at or above the locked version: mcp < 1.30.0 is covered by
    # Dependabot security alert #57, and a PyPI install does not read uv.lock.
    # The <2 cap is load-bearing: server.py imports mcp.server.fastmcp, which
    # mcp 2.x removed (FastMCP became mcp.server.mcpserver.MCPServer). Without
    # it a fresh wheel install can resolve mcp 2.x and `vox mcp` dies on import.
    "mcp>=1.30.0,<2",
    "mutagen>=1.47.0",
    "openai>=1.0.0",
    "pydub>=0.25.0",
    "audioop-lts>=0.2.1",
    "typer>=0.29.1",
    "websockets>=15.0",
    # voxd hosts the lux music-player app and the vox-panel applet: the public
    # LuxClient facade is a hard runtime dependency — identity/lease
    # (LuxClient.for_identity, ClientIdentity), scene push (client.scene.show),
    # session menu registration (client.callback.register, with the frame it
    # reopens), and the subscribe/callback listener (client.listener) with
    # per-handshake on_connect for register-fresh. LuxRestClient/LuxHubClient
    # are gone from the public surface;
    # the noun-grouped facade with async accessors is the only supported entry.
    # Keep this floor at or above the locked version. It bounds installs from
    # below only: no install can resolve a lux older than the one CI exercises.
    # It does NOT pin installs to the lock — a newer patch still resolves, so
    # keeping the lock current is what keeps tests honest. The ceiling is the
    # next minor: lux is pre-1.0 and has removed an API in a minor release
    # (client.frame.raise_), so a minor bump is a deliberate, tested move.
    "punt-lux>=0.33.1,<0.34",
]

[project.optional-dependencies]
# PortAudio (the C library sounddevice binds) is a separate runtime
# dependency this project does not otherwise need -- Homebrew's
# ``portaudio`` on macOS, ``libportaudio2`` on most Linux distributions,
# nothing `install.sh` provisions today. A hard top-level dependency here
# would make every `vox` invocation -- `vox say`, `vox status`, every
# hook -- fail on a host without it installed, even though only
# `vox call` (the live, microphone-capture path) needs it. Install
# with `pip install punt-vox[call]` / `uv sync --extra call`.
call = ["sounddevice>=0.5.6"]

[project.urls]
Homepage = "https://github.com/punt-labs/vox"
Repository = "https://github.com/punt-labs/vox"
"Bug Tracker" = "https://github.com/punt-labs/vox/issues"

[project.scripts]
vox = "punt_vox.__main__:app"
voxd = "punt_vox.voxd:entrypoint"
vox-panel = "punt_vox.panel.applet:app"

[dependency-groups]
roundtrip = ["faster-whisper==1.2.1", "av<19"]

dev = [
    "pydoclint==0.12.0",
    "markdown==3.11.3",
    "types-markdown>=3.10,<4",
    "punt-oo-ratchet==0.4.0",
    "mypy>=1.18.1",
    "pyright>=1.1.400",
    "ruff>=0.13.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.8.0",
    # Builds the throwaway certificates the TLS-verification tests handshake with.
    "cryptography>=46.0.0",
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.8",
]

[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

# The parser distributions share an import namespace; install only the fork.
[[tool.uv.dependency-metadata]]
name = "cyclopts"
version = "4.8.0"
requires-dist = [
    "attrs>=23.1.0",
    "docstring-parser-fork==0.0.16",
    "rich-rst<2.0.0,>=1.3.1",
    "rich>=13.6.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "typing-extensions>=4.8.0; python_version < '3.11'",
    "ipdb>=0.13.9; extra == 'debug'",
    "line-profiler>=3.5.1; extra == 'debug'",
    "coverage[toml]>=5.1; extra == 'dev'",
    "mkdocs>=1.4.0; extra == 'dev'",
    "pre-commit>=2.16.0; extra == 'dev'",
    "pydantic<3.0.0,>=2.11.2; extra == 'dev'",
    "pytest-cov>=3.0.0; extra == 'dev'",
    "pytest-mock>=3.7.0; extra == 'dev'",
    "pytest>=8.2.0; extra == 'dev'",
    "pyyaml>=6.0.1; extra == 'dev'",
    "syrupy>=4.0.0; extra == 'dev'",
    "toml<1.0.0,>=0.10.2; extra == 'dev'",
    "trio>=0.10.0; extra == 'dev'",
    "gitpython>=3.1.31; extra == 'docs'",
    "myst-parser[linkify]<5.0.0,>=3.0.1; extra == 'docs'",
    "sphinx-autodoc-typehints<4.0.0,>=1.25.2; extra == 'docs'",
    "sphinx-copybutton<1.0,>=0.5; extra == 'docs'",
    "sphinx-rtd-dark-mode<2.0.0,>=1.3.0; extra == 'docs'",
    "sphinx-rtd-theme<4.0.0,>=3.0.0; extra == 'docs'",
    "sphinx<8.2.0,>=7.4.7; extra == 'docs'",
    "markdown>=3.3; extra == 'mkdocs'",
    "mkdocs>=1.4.0; extra == 'mkdocs'",
    "pymdown-extensions>=10.0; extra == 'mkdocs'",
    "tomli>=2.0.0; (python_version < '3.11') and extra == 'toml'",
    "trio>=0.10.0; extra == 'trio'",
    "pyyaml>=6.0.1; extra == 'yaml'",
]

[tool.uv.build-backend]
module-name = "punt_vox"

[tool.ruff]
line-length = 88
target-version = "py313"
# .claude/rules/*.md carry fenced Python examples (some intentionally
# non-conforming); ruff must not try to parse them as source.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit (security)
    "BLE",  # flake8-blind-except
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "A",    # flake8-builtins
    "ERA",  # flake8-eradicate (commented code)
    "PIE",  # flake8-pie
    "RSE",  # flake8-raise
    "ARG",  # flake8-unused-arguments
    "RET",  # flake8-return
    "PERF", # perflint
    "PTH",  # flake8-use-pathlib
    "ISC",  # flake8-implicit-str-concat
    "FBT",  # flake8-boolean-trap
    "C90",  # mccabe complexity
]
extend-select = ["PLC0415"]

ignore = [
    "TC001",  # Move import into TYPE_CHECKING - too aggressive
    "TC003",  # Move standard lib import into TYPE_CHECKING
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "S603", "S607", "T20", "SLF001", "ARG", "FBT", "PLC0415", "C901"]
"scripts/*" = ["T20", "S108", "S603", "S607", "PLC0415"]
"tools/*" = ["T20", "S603", "S607", "C901", "PERF403", "SIM102", "N806", "C420"]
"typings/*" = ["A002"]
"src/punt_vox/__main__.py" = ["T20", "PLC0415", "S603", "C901"]
"src/punt_vox/doctor.py" = ["PLC0415", "C901"]
"src/punt_vox/doctor_mpv.py" = ["S603"]
"src/punt_vox/server.py" = ["PLC0415", "C901"]
"src/punt_vox/voxd/daemon.py" = ["PLC0415"]
"src/punt_vox/voxd/synthesis.py" = ["PLC0415"]
"src/punt_vox/voxd/health.py" = ["PLC0415"]
"src/punt_vox/voxd/speech_handlers.py" = ["C901"]
"src/punt_vox/client.py" = ["PLC0415", "C901"]
"src/punt_vox/hooks.py" = ["T20", "PLC0415", "S603", "S607", "S311"]
"src/punt_vox/types_synthesis.py" = ["C901"]
"src/punt_vox/paths.py" = ["PLC0415"]
"src/punt_vox/service/__init__.py" = ["PLC0415"]
"src/punt_vox/service/process.py" = ["S603"]
"src/punt_vox/service/launchd.py" = ["S603"]
"src/punt_vox/service/systemd.py" = ["S603"]
"src/punt_vox/service/installer.py" = ["PLC0415"]
"src/punt_vox/playback.py" = ["S603", "S607"]
# git check-ignore: the call agent's secret guard asks git what it ignores.
"src/punt_vox/voxd/workers/policy.py" = ["S603", "S607"]
"src/punt_vox/voxd/workers/command.py" = ["S603", "S607"]
# The supervised harness argv is intentional; its environment is isolated.
"src/punt_vox/voxd/workers/bootstrap.py" = ["S603"]
"src/punt_vox/voices.py" = ["S311"]
"src/punt_vox/providers/__init__.py" = ["PLC0415", "S603"]
"src/punt_vox/providers/elevenlabs.py" = ["PLC0415"]
"src/punt_vox/voxd/conversation_mode/mic_audio_source.py" = ["PLC0415"]
"src/punt_vox/voxd/pcm_output.py" = ["PLC0415"]
"src/punt_vox/providers/elevenlabs_music.py" = ["PLC0415"]
"src/punt_vox/providers/openai.py" = ["PLC0415"]
"src/punt_vox/providers/polly.py" = ["PLC0415"]
"src/punt_vox/providers/say.py" = ["S603", "S607"]
"src/punt_vox/providers/espeak.py" = ["S603", "S607"]
"src/punt_vox/providers/convert.py" = ["S603", "S607"]
"src/punt_vox/providers/local_play.py" = ["S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
skip-checking-short-docstrings = false
allow-init-docstring = true
check-style-mismatch = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
# Stdlib names fixed by the base-class API: the RotatingFileHandler override
# method ``doRollover`` (renaming it would fail to override -- N802) and the
# ``maxBytes``/``backupCount`` keyword arguments that dictConfig forwards by
# name to a factory (renaming them would break the "()" call -- N803).
extend-ignore-names = ["doRollover", "maxBytes", "backupCount"]

[tool.ruff.lint.isort]
known-first-party = ["punt_vox"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
platform = "linux"
mypy_path = "typings"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
enable_error_code = ["ignore-without-code"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = "error"
venvPath = "."
venv = ".venv"
extraPaths = ["."]

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownMemberType = false

