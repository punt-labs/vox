[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q -m 'not slow and not integration and not subprocess and not sdk and not e2e and not roundtrip and not quarantine and not playback and not levels'"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "quarantine(reason): temporarily exclude a flaky test; reason must name a Linear issue",
    "playback: real daemon audio-device monitor capture (nightly/manual)",
    "roundtrip: real TTS to STT word-error-rate oracle (provider matrix also marked integration; Claude Code also marked agent)",
    "agent: marks tests driving the vox plugin through paid headless Claude Code (run with -m agent)",
    "integration: marks tests requiring real, credentialed provider API calls (run with -m integration)",
    "slow: marks tests with heavy real-subprocess or real-filesystem overhead (run with -m slow)",
    "subprocess: marks tests that spawn real shell/git subprocesses (hook scripts, install.sh, plugin-surface gate; run with -m subprocess)",
    "sdk: marks tests that drive a real Claude Agent SDK session and cost real money (run with -m sdk)",
    "levels: signal-level loudness, silence, and track-change checks for chimes and music via ffmpeg ebur128/silencedetect and an mpv render (offline by default; live music also marked integration)",
    "e2e: marks packaging-e2e tests that drive the INSTALLED wheel -- `vox` binary as a subprocess and `vox mcp` over stdio; catches entry-point resolution / missing-wheel-data / stdio-startup faults no in-process test can see (run with -m e2e; requires `make install` first)",
]
filterwarnings = [
    # Upstream elevenlabs SDK bug: pydantic v1 compat on Python 3.14. Remove when elevenlabs ships a fix.
    "ignore:Core Pydantic V1 functionality isn't compatible with Python 3.14:UserWarning:elevenlabs\\.core\\.pydantic_utilities$",
]

[tool.coverage.run]
branch = true
parallel = true
source = ["punt_vox"]
omit = ["tests/*", "*/test_*.py"]

[tool.coverage.paths]
source = ["src/punt_vox", "*/site-packages/punt_vox"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == \"__main__\":",
    "if TYPE_CHECKING:",
    # Protocol/abstract method stub bodies are unexecutable by definition.
    "^\\s*\\.\\.\\.\\s*$",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2
