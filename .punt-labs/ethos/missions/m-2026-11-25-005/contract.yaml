context: 'A long-running voxd keeps the PortAudio device list it enumerated at startup. On 2026-11-25 Jim connected AirPods after voxd started; music (a fresh mpv process) went to the headphones, but the call captured from ''MacBook Air Microphone'' and played agent audio through the speakers, producing the echo loop. After a daemon restart the same call used the AirPods (capture rms 41 vs 331). Fix in the daemon: at every call start, before any PortAudio stream opens, refresh the device list so input and output follow the system''s current defaults; log the OUTPUT device by name next to the existing ''Call input device'' line (that line lives in conversation_mode/mic_capture.py, which you own; if a line must live in voice_call or voice_agent/call_overrides.py, report the exact line and the leader adds it, those files belong to a parallel mission); and when input and output are on different hardware, log that as the echo configuration. Unit tests with a fake sounddevice prove the refresh and the log lines; the call_e2e tier must stay green (the VOX_PCM_OUTPUT=silent path is unchanged). Worktree: <repo>/.claude/worktrees/pl-1619-call-devices, branch fix/pl-1619-call-devices. CHANGELOG.md and the ratchet files (.oo-baseline.json, .oo-audit.jsonl, .oo-coupling-*.json*) are NOT in your write set because the parallel mission holds them: when the commit hook demands a baseline update or bless, stop, state the file, metric and your one-line reason in a message, and the leader runs the bless in your worktree; hand your CHANGELOG line to the leader in the result. Commit hook must pass on every commit; first commit within 30 minutes; never push, never create branches, never touch .punt-labs/vox/vox.md.'
