        environment fails to start cleanly, before the call opens.

        H2: pi_extension/secret_guard.js, loaded with --extension <abs path> after
        --no-extensions; ships in the wheel (verified with uv build). tool_call handler:
        pi-identical normalization (unicode spaces, @, ~, file://, resolve vs session cwd),
        realpath of nearest existing ancestor, must be inside the repo root, then patterns
        case-insensitively; grep glob / find pattern checked as written and with glob chars
        stripped; any non read/grep/find/ls tool refused; missing/malformed config blocks
        everything; returns {block: true, reason, terminate: true}. Config via
        VOX_CALL_GUARD_ROOT / VOX_CALL_GUARD_PATTERNS, set by vox after the allowlist so a
        parent cannot override them. Python side: PiPath mirrors pi normalization;
        SecretPathPolicy.denies(candidate, cwd=) adds confinement, case-insensitivity;
        denies_glob; guard_env. The stream layer is now ToolScreen and fires only on a call
        that actually executed (tool_execution_end, isError false), with grep output resolved
        against grep's own search path -- so a guard-blocked read leaves the call running.

        Decision beyond the list: with terminate: true the model never speaks after a block
        (the live probe returned an empty reply), so a turn ended by the guard yields
        GUARD_REFUSAL, a fixed spoken sentence, instead of silence.

