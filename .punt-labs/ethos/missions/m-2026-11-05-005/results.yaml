      prose: |
        Commits: 36aef9d (CallAgentState + SecretPathPolicy), f35a4ce (pi call agent replaces
        ClaudeSessionAttach), 7018686 (/call slash command + coverage matrix).

        Open details decided:
        - Snapshot transport: `vox call start --context PATH`, where PATH may be `-` for stdin.
          /call start <topic> passes it on stdin through a quoted heredoc
          (`vox call start --context - <<'VOX_CONTEXT'`), so no temp file to create or clean
          up and nothing in the snapshot is shell-expanded. Required; 64KB cap; empty refused.
        - calls_dir retention: newest 50 summaries kept, older pruned on every write. Call ids
          are UTC-timestamped (YYYYMMDDTHHMMSSZ-<6 hex>) so name order is chronological.
          Files 0600 under a 0700 dir; ensure_user_dirs creates calls/.

        Design calls made inside the ratified design (flag any you disagree with):
        - The process is held by asyncio.create_subprocess_exec in the process that runs the
          call. CallSession runs in `vox call start` (the CLI process), not in voxd, so "Popen
          in voxd" in the contract is realized where CallSession actually lives; moving the call
          loop into the daemon would be a separate architectural change.
        - Deny-list enforcement: pi has no path-level read gate without an extension, and the
          bead forbids adding extensions. Verified live: pi starts executing a tool in the same
          millisecond it announces it (message_end -> tool_execution_start), so nothing outside
          pi can block the read itself. Enforcement is therefore (1) the deny-list as a HARD RULE
          in --append-system-prompt (DES-066's named mechanism), plus (2) voxd-side screening of
          every toolcall_end / tool_execution_start argument and every grep result line: any hit
          aborts the turn (AbortTurn, process killed), so no reply text from that turn is spoken,
          summarized, or kept in a live context, and the call ends with a fixed explanation.
          A true pre-read block needs a ~20-line pi tool_call extension via -e; that is an
          operator call against the no-extensions rule.
        - Extra launch hardening beyond the contract: --no-mcp (pi --tools keeps MCP tools
          unless told otherwise), --no-skills, --no-prompt-templates, --no-approve (ignore
          project-local .pi config that could re-enable tools/extensions).
        - The summary is authored by the agent as its final turn and persisted by voxd: the
          agent is read-only and cannot write the file itself. Summary only on a clean end
          (hangup, stop, timeout, script end) with >=1 turn handled; an abnormal end (crash,
          Ctrl-C) abandons the agent (Teardown or AbortTurn) with no summary turn.
        - transfer, --session, SessionDiscovery, ClaudeSubprocessEnv, BareAuthMissingError
          deleted: a call agent is attached to no session, so transfer had no referent.
        - Provider error mid-reply is transient (agent ready again, "try again");
          CallAgentEndedError (silence, death, denied path, refused prompt) ends the call.

        Outside the write-set, needs the leader:
        - plugin/hooks/call-lock.sh still bypasses on VOX_CALL_RELAY (now never set) and lets
          `/call transfer` through; its bypass regex `^/call[[:space:]]+(stop|transfer)` also
          does not match `/vox:call stop`. tests/test_hook_gate.py exercises the transfer bypass.
        - DESIGN.md / CHANGELOG / README: --context flag, transfer removal, retention policy.

        Ratchet: OO relaxed with justification for paths.py module_size, call_session.py
        avg_complexity, reply_delivery.py avg_params/avg_complexity, session_attach.py
        avg_params (each only from deleting trivial methods or adding calls_dir). Coupling
        relaxed for paths.py public_names (calls_dir) and call_control.py / call_lock.py
        (stale baseline: HEAD already had those imports). call.py efferent 14 -> 9, size
        290 -> 196, method_ratio -> 1.0.
