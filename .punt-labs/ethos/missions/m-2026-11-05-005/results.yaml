        Commits (one per ruled item, make check green on each): 531095b H1, f13296a L3,
        7bb21b7 H2, 1fa2de8 M1, d6b4f88 L1, 334288e L2.

        H1: CallAgentEnv (new module) admits only PATH, HOME, USER, LOGNAME, SHELL, LANG,
        TERM, TMPDIR and the LC_/XDG_/PI_ prefixes. Credential decision: none is passed.
        pi authenticates from ~/.pi/agent (reached via HOME); verified live -- pi answered
