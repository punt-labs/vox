      open_questions:
        - Q1-Q5 remain open in section 11; Q3 updated to require the pidfd/start-time DaemonProcess handle and exclude other ports and invisible holders
        - 'pembroke sudo policy not probed: the agent shell is denied sudo -n -l; demo step 0 has the operator record it'
      prose: |
        djb findings and where each is resolved:
        1 HIGH sudo -v: removed. Section 3.3 (lines 138-184) PrivilegedRun runs
          sudo -n first and classifies by exit code (4 permission_denied,
          5 not loaded) plus re-observed state. The only probe is
          sudo -n -l systemctl <verb> voxd, run only on an ambiguous exit 1.
          Interactive fallback only with a tty. Stderr text is never parsed.
          The timestamp_timeout=0 limit is stated. Test
          scoped_nopasswd_runs_once_no_probe_no_prompt is in 10.1. Demo step 0
          plus step 8 cover both sudo cases (10.2, lines 653+).
        2 MEDIUM fail-open probe: 3.4 (lines 186+): find_pid_on_port and
          is_vox_daemon_process raise PortProbeError, which maps to
          backend_failed. Old S7 is deleted (note under 4.1). New S7 (line 341)
          and T4 detect a holder vox cannot see via a token-free TCP connect
          (port_listening), giving timeout or port_conflict. Tests are in 10.1.
        3 MEDIUM pid reuse: 3.4 DaemonProcess uses pidfd_open, /proc cmdline and
          start time, and pidfd_send_signal on Linux. On macOS it re-checks start
          time and cmdline before TERM and before KILL. Root refusal and the
          8421-only scope of the voxd match are stated in 3.4 and section 6. 5(c)
          now uses the handle, so a reused pid counts as exited and there is no
          PermissionError path. kill_pid is rewritten on the handle.
        4 MEDIUM restart stale/foreign: T2 (line 355) applies T8/T9 inside.
          Restart calls start(require_fresh=True), so a stale version gives
          version_mismatch and a foreign pid gives backend_failed. The 4.3
          pseudocode comment is corrected. Tests for these are in 10.1.
        5 MEDIUM trust boundary: 3.5 (lines 256-283). Bind comes from
          backend.installed_bind() (unit or plist), not the env. A missing
          serve.token raises DaemonNotUp with no connect, and VoxClientSync is
          never built with token=[redacted-secret]. A token-bearing request is sent only when
          a visible voxd process holds 8421.
        6 LOW port set: 3.4 Ports paragraph. The probe watches 8421 plus
          serve.port, and only 8421 counts or is ever signalled. Test
          S6b_voxd_on_other_port_named_not_signalled.
        7 LOW host name: every okinos mention is now pembroke (lines 19, 653-698).
        djb also asked that the Z model cover the T2-inside-restart path. Done:
        section 8, ProB property 3, plus token-gate and signal-scope properties
        4-5.
