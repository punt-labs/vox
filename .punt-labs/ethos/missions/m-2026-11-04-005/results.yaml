      prose: |
        Design specifies stop/start/restart in service/ behind a ServiceBackend
        Protocol (SystemdBackend, LaunchdBackend), a DaemonProbe (pids on port +
        pinned health), and a LifecycleReport with a closed 11-outcome set.
        restart = stop then start, with no lifecycle logic of its own.
        daemon_restarter.py is deleted. Found two silent failures:
        SystemdBackend.stop (check=False) and LaunchctlAgent.bootout ignoring
        non-zero on a loaded job. Write-set, unit tests per outcome, and a
        10-step okinos demo are in sections 8-9.
