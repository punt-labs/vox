context: |
    Bead vox-9354 (vox, P2): 'vox daemon' exposes install, uninstall, restart and status but no stop or start, so voxd cannot be brought down and left down, or brought up without first bringing it down. Verifying a fresh build needs a restart, which conflates the two halves and reports one outcome for both. Nothing can stop the daemon for a maintenance window, a port conflict, or to free the audio device, short of killing it by pid.
    This is a DESIGN mission: produce docs/daemon-lifecycle-design.md only. Do not write code. The write-set for implementation is the design's output; the leader reviews it and the operator ratifies it before any implementation mission dispatches.
    Read the existing service/ package (installer, launchd, systemd, keys_env), the 'vox daemon' CLI commands, and how 'vox daemon restart' and 'vox daemon status' work today, including the sudo path ('vox daemon restart' prompts for sudo on Linux). Follow vox CLAUDE.md (OO standards, ratchet, no migration/compat code) and docs/WORKFLOW.md.
    Worktree: <repo>/.claude/worktrees/daemon-stop-start, branch feat/vox-9354-daemon-stop-start. It already holds one unrelated commit (98b1c3f, vendored claude.yaml); leave it alone.
