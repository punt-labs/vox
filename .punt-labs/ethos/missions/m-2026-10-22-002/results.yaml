        Version table:
          anyio    4.12.1 -> 4.14.2 (python < 3.15), 4.15.1 (python >= 3.15)
          PyJWT    2.13.0 -> 2.15.1
          urllib3  2.7.0  -> 2.8.0
          mcp      1.28.1 -> 1.30.0

        Forced extra moves: none by version. The anyio fork rewrote the
        anyio dependency edges of httpx, httpx2, mcp, openai,
        py-key-value-aio[filetree], sse-starlette, starlette and watchfiles
        into two marker-split edges, and added markers to secretstorage's
        cryptography/jeepney edges. Those are marker rewrites only; each
        package keeps its version.

        Upstream reads. PyPI was unreachable from the sandbox (curl denied),
        so I diffed the installed sources (main checkout venv vs worktree
        venv) instead of reading published changelogs. Treat that as a
        stronger check than a changelog, but it is not the changelog.

        mcp 1.28.1 -> 1.30.0: mcp/server/stdio.py, lowlevel server,
        tools/ manager, exceptions and types used by vox are byte-identical.
        The FastMCP changes are: new HTTP/SSE settings (max_request_body_size,
        session_idle_timeout, max_sessions) with defaults; bearer-auth
        resource validation; Settings.model_rebuild(); related_request_id on
        progress reports; output-schema inlining for root $ref (self-referential
        models); and re.match -> fullmatch in resource templates and tool-name
        validation. Vox runs stdio only, its tool names are plain ascii, and it
        relies on call_tool, _tool_manager.get_tool, tool.parameters and
        _mcp_server.version, none of which changed. Client-side auth and
        streamable-HTTP changes do not reach vox.

        anyio 4.12.1 -> 4.14.2: vox imports anyio nowhere. The diff is
        additive (new itertools module, AsyncFile limiter argument, Path
        helpers) plus internal import reshuffles (CapacityLimiter/Event moved
        to _core._synchronization). The to_thread.run_sync and memory-stream
        changes are docstring and import-only. No change in task-group or
        thread semantics that touches vox.

