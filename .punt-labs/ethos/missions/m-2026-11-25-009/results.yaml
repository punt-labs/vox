      prose: |
        Round 2 closes the shutdown window from both sides. voxd unpublishes
        serve.port and serve.pid as the first act of its lifespan exit, so a
        process that lingers through worker and player teardown after uvicorn
        closed its socket is no longer advertised. And the CLI's published door
        no longer trusts "alive, this user's, running voxd" alone: it asks,
        within the health bound, whether that pid itself holds the listener on
        the service port, through a per-process check that never walks every
        open file (lsof -a -p on macOS; /proc/net/tcp inodes against
        /proc/<pid>/fd on Linux). A publisher without the port, or a check that
        cannot be made in time, sends nothing and names itself. The fakes model
        the holder rule, so the status test that reaches the "token went to the
        published port" branch now has the publisher exit between the request
        and attribution, which is the only way that branch is reachable.

        Item 2 bounds the serve.pid parse at pid_t so an oversized number is a
        named unparseable reading instead of an OverflowError traceback.
