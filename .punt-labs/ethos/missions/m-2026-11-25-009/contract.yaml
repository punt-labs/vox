context: 'Continuation of m-2026-11-25-008 (closed on its passing round 1) for PL-1497 on branch fix/pl-1497-daemon-status-lsof in the main directory <repo>; same rules (no worktree, no push, hook on every commit, no --no-verify, pytest -n 2 under load 40, no make check/make test). This mission carries the review fix round: eleven findings from the evaluator, silent-failure hunter, code-reviewer and Qodo, already sent to the worker in messages, headed by the High: a stale serve.port after a voxd crash lets another local user who binds 127.0.0.1:8421 receive this user''s token. Ruling: voxd publishes serve.pid next to serve.port (PortFile.write/remove, atomic rename, same discipline), and the CLI asks health only when serve.port is this user''s and names the service port, serve.pid names a pid that os.kill(pid, 0) accepts, the bounded ps identity says the command is voxd, the bind is loopback and the port accepts a connection; otherwise it is not asked, with the reason naming the dead or foreign publisher. Port and owner (and pid) come from a single stat of the file that was read. The write set adds src/punt_vox/voxd/port_file.py, voxd/daemon.py, service/stale_port_file.py and their tests for that purpose. Everything else from the round: may-ask floor at MIN_HEALTH_S; unknown branches name the health miss; PortProbeError becomes NotAskedError; not-owned, stat-failed and unparseable reasons separated; per-module test files for the five new modules; vacuous reserve test removed or made real; the health deadline starts before the target lookup; the ''vox sent it no token'' line names a sent request. Proof: the service test set plus the new files, make check-comments, ruff/mypy/pyright on changed files, then make install, vox daemon restart, vox daemon status and --json pasted. Submit the result to this mission.'
