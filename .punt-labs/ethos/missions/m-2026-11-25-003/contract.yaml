context: 'Jim, 2026-11-25: ''I could not say something like goodbye or end call and have the call end. The agent didn''t know how to end a call.'' The call agent''s tool catalogue (voxd/voice_call/boss_tools.py) has only worker tools and remain_silent; nothing acts on the call. ElevenLabs Conversational AI provides a built-in end_call system tool enabled in the agent configuration. Required: a spoken goodbye / end the call / hang up ends the call. Add the end-call capability to the agent registration (voice_agent/control.py tool catalogue and fingerprint, session options), have the daemon treat the resulting conversation end as a normal call end (call_status ''ended'', transcript and trace written, ''Call ended'' logged with reason), and have the agent say one closing sentence first (seed.py role prompt). The registration fingerprint changes, so document the one-time ''vox call teardown'' in CHANGELOG. Prove it in the call_e2e tier (tests/e2e_call): script the fake agent to emit the end-call event and assert the daemon ends the call cleanly and the CLI exits 0 with ''call ended''. Worktree: <repo>/.claude/worktrees/pl-1620-end-call, branch fix/pl-1620-end-call. Do not touch call_overrides.py, conversation_mode, pcm_stream.py or playback.py (another mission owns them). Commit hook must pass on every commit; first commit within 30 minutes; never push, never create branches, never touch .punt-labs/vox/vox.md.'
