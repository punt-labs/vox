      open_questions:
        - 'Spared vs killed: I chose ''judged once'' -- a pid spared as in the service cgroup is never signalled later in the same stop, even if it leaves the cgroup. The alternative (signal it later and drop the spared line) also meets the criterion; tell me if you want that instead.'
        - 'serve.port ''once per stop'': the cleanup call is made at most once, and is deferred (no probe call) while a voxd stop has not killed still holds 8421. If every holder is spared or survives, the file is never touched in that stop.'
        - Poll.until_within runs no extra check at the deadline (a check with zero budget could only time out); a condition that becomes true in the last clipped sleep reads as not-yet. Poll.until/first keep their final check.
        - 'A timed-out query inside a bounded wait reads as ''not confirmed'' (False), not an error: systemd is_active_within maps code 124 to False, launchctl running_within/_left_within map TimeoutExpired to False. Outside bounded waits a timeout still raises as before.'
      prose: |
        Commits on feat/vox-9354-daemon-stop-start:
          6a0c16f fix(service): no bounded wait overruns its bound
          f871da0 fix(service): stop reports from what it recorded when it signalled

        Criterion -> failing-first tests
        1. Report reads only signal-time records (djb B1):
           test_service_lifecycle_stop.py::test_probe_failure_after_a_signal_names_every_signalled_pid
             (djb's scratch scenario ported: exited() and service_owned(201) raise after terminate)
           ::test_timeout_report_runs_no_probe, ::test_stopped_report_runs_no_probe
             (every probe and manager query fails once the settle poll returns)
        2. Every signalled pid named with the true reason (djb B2, CR1, SFH):
           ::test_sigterm_only_kill_that_exits_on_a_later_tick_is_named_killed
           ::test_sigterm_only_survivor_is_explained_by_the_deadline
           test_service_kill_ledger.py (SIGNALLING named after a failed terminate; TERM_ONLY reason)
        3. serve.port cleanup once, after a confirmed exit, no holder, stale file removed, failure noted once:
           ::test_port_file_cleanup_runs_once_and_notes_a_failure_once
           ::test_port_file_kept_while_a_visible_voxd_holds_the_port
           test_service_process.py::test_discard_port_file_* (unparseable removed, other port kept, unlink/read failure raises)
           test_service_daemon_probe.py::test_clear_port_file_discards_a_stale_service_port_file /
             ::test_clear_port_file_leaves_the_file_of_a_voxd_on_the_port
           (::test_port_file_cleanup_waits_for_a_confirmed_exit and
            ::test_unparseable_port_file_is_removed_after_the_kill are guards; they passed before the fix)
        4. Spared never also killed; active re-check before each signal:
           ::test_spared_pid_is_never_also_reported_killed
           ::test_manager_is_asked_again_before_each_signal
        5. No wait overruns its bound:
           test_service_clock.py::test_until_never_sleeps_past_the_deadline,
             ::test_until_within_hands_each_check_the_time_that_remains
           test_service_launchctl.py::test_wait_bounds_each_print_by_what_remains_of_the_wait,
             ::test_wait_reads_a_print_cut_short_by_the_wait_as_still_registered,
             ::test_running_within_* (4)
           test_service_systemd.py::test_is_active_within_* (3)
           test_service_launchd.py::test_launchd_is_active_within_* (2)
           test_service_health_verify.py::test_verify_never_lets_an_active_query_outlive_the_wait
        6. Test count 5701 -> 5740; no new suppressions; ratchet relaxations are per-file --relax
           with justifications in .oo-audit.jsonl / .oo-coupling-audit.jsonl. The coupling update in
           6a0c16f also recorded service modules earlier rounds added but never baselined.
