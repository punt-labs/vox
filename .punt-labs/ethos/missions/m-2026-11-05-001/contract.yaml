success_criteria:
    - 'stop''s report is built only from outcomes recorded when each signal was sent; no probe (exited(), ps, identity, service_owned) runs on the reporting path, so a probe failure after a signal yields backend_failed naming every signalled pid, never a traceback (djb B1; regression test: fake exited() and service_owned(201) raise after a terminate)'
    - 'every pid stop signals is named in its report: STOPPED names each confirmed-gone signalled pid as killed (including one that exits on a later tick after a below-floor SIGTERM-only terminate); timeout/backend_failed name unconfirmed ones with the true reason, and a SIGTERM-only handle''s reason says the deadline left no time for a grace period, not ''ignored the signals'' (djb B2, code-reviewer 1, silent-failure-hunter High/Medium)'
    - serve.port cleanup runs once per stop, only after a signalled handle is confirmed gone, only when the file names 8421 and no visible voxd holds 8421 at that moment, and removes an unparseable (stale) file; a cleanup failure is noted once in the detail, not once per tick (code-reviewer 2, silent-failure-hunter R8 and Low, Qodo efaee7f7 and 8f5ca9c8)
    - a pid spared because it is in the service cgroup is not later reported as both spared and killed; the manager-active re-check runs before each individual signal, not once per tick (silent-failure-hunter Low, Qodo dacfeb5c)
    - 'no wait overruns its bound: Poll.until never sleeps past the remaining budget; each launchctl/systemctl query inside a bounded wait (wait_until_unregistered, HealthVerifier''s active-state poll) gets a timeout no larger than that wait''s remaining time (Qodo 0e1f71da, 1a65ddde, 3316be35)'
    - each fix lands with a test that fails without it; make check passes on every commit (ruff, mypy, pyright, markdownlint, pytest, check-oo, check-coupling, check-suppressions); test count does not drop; any ratchet relaxation is scoped to named file+metric entries, each justified in the audit log
