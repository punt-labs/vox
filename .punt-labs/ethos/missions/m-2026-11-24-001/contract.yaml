context: 'Worktree: <repo>/.claude/worktrees/pl-1491-mic-silence on branch fix/pl-1491-call-mic-silence-and-logging. Fixes PL-1491 (silent mic) and PL-1494 (no call logging) together because both touch the same capture and call code. Evidence: on 2026-11-23 a launchd-started voxd had the mic denied by macOS TCC (Auth Right: Denied (System Set)); CoreAudio returned zeros, sounddevice raised nothing, the call sent 1602 silent 20 ms chunks and ElevenLabs transcribed ''...''; the daemon log had no line about the call. Capture is MicAudioSource.chunks in voxd/conversation_mode/mic_audio_source.py (RawInputStream, 16 kHz mono int16, 20 ms blocks) wrapped by MicInput in voxd/voice_call/inputs.py; VoiceAgentCall._pump in voxd/voice_call/call.py forwards chunks; CallHandlers._launch in voxd/voice_call/handlers.py builds the call and knows input mode and echo declaration; BossTools.answer in voxd/voice_call/boss_tools.py runs tools. Design is yours: a silence detector belongs in the input layer (a MicInput wrapper or a small class the pump uses), not in the ElevenLabs session. ScriptInput must never trip the silence check (scripts begin with speech but a test script may be short; gate the check on mic input only). Rules: .claude/rules/python-*.md, __new__ not __init__, @final, frozen slots dataclasses, no T | None without a justifying comment, no hasattr, no broad except, logger = logging.getLogger(__name__). Commit discipline: one logical step per commit, first commit within 30 minutes, commit hook must pass, run make update-oo and stage .oo-baseline.json and .oo-audit.jsonl before the final commit. Do not push, do not open a PR, do not touch other worktrees.'
