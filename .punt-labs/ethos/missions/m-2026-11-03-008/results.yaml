      prose: |
        Root cause is in lux, not vox. Stopped per contract; no commits made.
        The operator's sequence (idle scene installed, album starts, press
        play/pause) goes idle -> playing as a PatchScene that sets label,
        tooltip, disabled, and publish {"topic": "music.pause"} on
        music.transport.playpause. vox plans this correctly. lux's
        ButtonElement._set_publish (button.py:181-183) swaps the _publish
        declaration, but the click handler that actually publishes is a
        PublishOnClick installed once at decode time by
        JsonButtonDecoder._install_publish (button_codec.py:120). That
        handler captured the idle-time ButtonPublish("music.resume"), so
        every click publishes music.resume forever. That matches vox.log:
        presses arrive as music.resume, the player ignores it while playing,
        and the scene is unchanged, so nothing is pushed. A failing vox test
        through lux's real decoder would be red under make check, so I
        committed nothing. The test belongs in lux next to the fix.
