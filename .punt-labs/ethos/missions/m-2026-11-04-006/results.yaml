      open_questions:
        - 'F0: on an uninstalled host whose probe fails, the result is ambiguous: backend_failed or not_installed. The model checks the probe first. Recommend stating that order in section 4.'
        - 'F1: S3 and T5 omit the section 3.2 re-observation, so a refusal that races a third party matches both the error row and the wait. Recommend: S3 only when still active, T5 only when still inactive.'
        - 'F2: stop has no row for a captured handle that closed its listener but has not exited. Recommend: S8 timeout, or extend S6 to terminate captured handles that are still alive.'
        - 'F3: with no MainPID and a fresh voxd answering, neither start path has a row. Recommend: T8 also covers mainpid = None.'
        - 'F4: the section 4.3 pseudocode compares bare pids, which contradicts section 3.4, and pid reuse gives a false backend_failed. Recommend deleting the branch: under handle comparison it is unreachable.'
        - 'F5: P2 holds only if is_active() turns false after the main process exits. True for systemd, unverified for launchctl bootout. Recommend capturing mainpid as a DaemonProcess at observe time and including it in section 5 condition (c).'
      prose: |
        docs/daemon-lifecycle.tex models the section 4 observation: installed,
        active, mainpid, the live voxd processes, the visible holder of 8421, an
        invisible holder, who answers health, and stale processes. Handle sets
        (captured, oldMain, doomed) are pruned when their process exits. The rows
        of each table are relations: stopPre, stopAct, stopSettle, startPre,
        startAct and startDecide. There is one operation schema per row group for
        Stop (14) and Start (11), plus 11 environment operations that race the
        verbs. Restart = Stop[vb?=vRestart] ; Env* ; Start, with the gap after
        stopped or already_stopped only. require_fresh is verb = vRestart, and
        StartEnd applies the relabelling.

        ProZ treats the state-schema predicate as a guard, which masks
        violations. So the state schema holds only declarations, and the physics
        and P1-P6 live in the Invariant schema, which probcli checks in every
        state. I confirmed this on a toy spec first.

        Properties, all holding over the 181105 reachable states:
        P1, exactly one row at every stage of every verb (total and
        deterministic). P2, inside restart no captured process and no
        old-main process is alive while start acts. P3, restart never reports
        restarted for the previous process, a process that is not the main pid,
        or a stale version. P4, tokenTo is a subset of onport. P5, signals only to
        S6-marked handles, and those are never the main pid. P6, the outcome set
        of each verb matches the section 4.4 table.

        The committed model carries the stated resolutions for F0-F4 and runs
        with syncStop = ztrue (systemd semantics). Each finding was reproduced on
        a scratch variant that reverts its resolution; the variants are in
        ~/Coding/punt-labs/.tmp/jms-lifecycle/. The design text was
        not edited.
