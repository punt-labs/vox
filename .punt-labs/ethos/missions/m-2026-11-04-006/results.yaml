      open_questions:
        - 'F6: the design''s is_active excludes deactivating. Three paths result: S2 already_stopped and S5 stopped while the manager''s main process lives (P2), and S6 marking the manager''s stopping process as unmanaged (P5). Recommend that deactivating, or main_pid() not None, count as active in every row. S2-only (mainpid = None) closes only the first path.'
        - 'F5 corrected: systemctl stop closes the path only for vox''s own stop. A third-party stop in flight is F6.'
        - 'F4: ''delete the branch'' is now conditional on the F5 and F6 fixes. Without them the branch stays, compares by handle, and must include the manager''s main process.'
      prose: |
        Round 2 answers jra's REVISE. Changes:
        1. Stopping mode added. EnvUnitDeactivating (inactive, main pid still
           reported); EnvUnitStop also completes a stop in flight; EnvUnitStart
           requires no main pid; EnvExit keeps a stopping unit inactive. The
           physics clause "mainpid nonempty implies active" is replaced by
           "active or mainpid nonempty implies installed".
        2. Constant deactActive selects the is_active reading. Every table
           receives isActive(active, mainpid) in place of active. zfalse is the
           design as written (F6); ztrue is the recommended fix, and the
           committed model, checked at ztrue, is clean.
        3. P2 is strengthened by a capture-independent ghost, leftAlive. It holds
           the manager's main process at the moment the stop half of restart
           declares success, pruned on exit; P2 requires it empty in phGap,
           phStartAct and phStartWait. It catches jra's S2 path, which the round-1
           P2 missed.
        4. The prose now says that P4 and P5's first conjunct hold by
           construction, while P5's second conjunct is a real check that F6
           breaks; that P3's previous-process conjunct is subsumed by P2; and
           that all results are for PID = {p1,p2,p3}.
        5. F5's "Linux is safe" sentence is corrected, F4's recommendation is
           made conditional, and F6 is added with all three paths.
        The design text is not edited. Scratch variants are in
        ~/Coding/punt-labs/.tmp/jms-lifecycle/r2/.
