context: 'Design mission for PL-1622: the vox call agent gets the repo''s ethos identity, the caller''s main-session hand-off context, non-essential capabilities, and silence handling. Jim''s demo verdict on main 7ffccc28: the call worked but the agent could do almost nothing and kept asking whether he was there while he was just waiting. Direction: (1) the agent speaks as the repo''s ethos identity (agent: claude per .punt-labs/ethos.yaml): name, personality, writing style, temperament rendered into the role prompt at call start, with a matching ElevenLabs voice; Vox is the phone, not the person. (2) The opener and a session_context tool carry the caller''s most recent main-session hook snapshot (what finished, what is in flight, what failed, what question is open); the hook context store already receives it (vox call context --session) but the agent never sees it. (3) Non-essential capabilities: time and call duration, what music is playing and the music controls, vox status, a short recent-activity summary, small talk within the identity, ending the call (already shipped, PL-1620). (4) Silence is not a prompt: set the agent turn timeout and instruct it to wait when the caller is quiet, asking once after a long silence in the identity''s words, never repeatedly. Read first: docs/conversation-mode-call-agent.tex, docs/hook-context-gaps.tex, docs/voice-call.tex, DESIGN.md DES-068 to DES-075, src/punt_vox/voxd/voice_call/seed.py, worker_brief.py, boss_tools.py, opening.py, greeting.py, src/punt_vox/voxd/voice_agent/control.py (agent config, built_in_tools, turn settings). This is a DESIGN mission: no production code. Output is a design document under docs/ (a .tex Z model is required only if the design adds a stateful subsystem with 3+ modes; the silence policy is a candidate, decide and say why), an ADR in DESIGN.md, and a write set plus test plan for the implementation missions. Strike any migration, compat, or shim element. Each open product question goes in the design as a concrete decision with a recommendation for Jim. Work in the worktree <repo>/.claude/worktrees/pl-1622-call-agent-design on branch design/pl-1622-call-agent. Commit one logical step at a time; first commit within 30 minutes. Machine load rule: never run make check or pytest -n auto; if you run tests use uv run pytest -q -p no:cacheprovider -n 2 <files> and check uptime is under 40 first. Never read ~/.punt-labs identity or secret directories. Never edit .punt-labs/vox/vox.md or vox.local.md.'
