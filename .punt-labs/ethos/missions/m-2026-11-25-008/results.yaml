      open_questions:
        - 'Leader may run the entry-point slow-lsof case: env PATH="$PWD/.tmp/pl1497/slowlsof:$PATH" vox daemon status (expected ''Daemon: ok on port 8421'' in under 2s)'
      prose: |
        The WIP a943f114 was kept as designed: StatusCheck asks voxd first through
        the port serve.port publishes (PublishedHealth, a reserved 1.5s of the 5s
        deadline), falls back to lsof/fuser attribution (AttributedHealth) only
        when that request misses, and both doors send the token through one
        bounded HealthRequest. The module split carries weight: each new module
        is one class with one gate, all wired, none speculative; ServiceCgroup is
        the cgroup reader lifted out of DaemonProbe.

        One required behaviour was missing from the WIP and is added: when the
        fallback probe fails, the unknown reading names both steps
        (StatusCheck._spent_on), for example "cannot run lsof: timed out after
        0.5 seconds; voxd was asked first and gave no answer: connection reset"
        or "...; voxd was not asked first: serve.port publishes no port; no token
        sent unattributed". Ticket ids are removed from all .py prose.

        Tests added: test_status_published_miss_then_attribution_is_running,
        test_status_unknown_names_the_health_miss_and_the_probe_that_failed,
        test_status_unknown_names_why_voxd_was_not_asked_first; the fakes gain
        FakeWorld.published_health_error so the published request can fail while
        the attributed one answers. The existing listener-check test now asserts
        the reason's prefix, since the reason carries the step naming.

        Ratchets: scoped blesses sourced PL-1497 on backend.py (protocol method),
        lifecycle_status.py (step naming; avg_params and avg_complexity improved),
        process.py (port_file property; avg_params and avg_complexity improved),
        and the coupling baseline for daemon_probe.py (composes the extracted
        requests). oo --update and coupling --update recorded the six new modules
        and eight improved files. No hand edits to any baseline JSON.

        Not touched: .punt-labs/vox/vox.md, vox.local.md, .claude/settings.json,
        .punt-labs/ethos/missions.jsonl (left modified and unstaged), README.md
        (its daemon status row already lists the four states).
