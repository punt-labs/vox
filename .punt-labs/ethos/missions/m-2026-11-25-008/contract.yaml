context: 'Finish PL-1497 (vox daemon status reports unknown when its lsof probe exceeds about two seconds on a loaded machine) on branch fix/pl-1497-daemon-status-lsof, to be checked out in the main directory <repo> by the leader before you start. Do NOT create a worktree or a new branch; never push; never --no-verify; never touch main. State on entry: one WIP commit a943f114 (committed with --no-verify; ratchets never passed) against a main five-plus merges old, 853 lines over 16 files: daemon status asks the daemon''s health over the port file''s port first with its own deadline, and falls back to lsof only when the health request fails; new modules attributed_health.py, health_request.py, not_asked.py, published_health.py, published_port.py, service_cgroup.py. The leader will have merged main into the branch (CHANGELOG is the only conflict) or will ask you to. Required behaviour (issue): a daemon that answers health is running, whatever lsof says; the health request has its own deadline; lsof runs only when health fails; the unknown outcome names which step ran out of time. Your job: (1) make the WIP a finished change: read it against the issue and the OO rules, remove anything speculative, keep the module split only where it carries weight; (2) tests prove the three outcomes with fakes (health answers -> running without lsof; health fails and lsof finds the listener -> running with the attribution; both fail within the deadline -> unknown naming the step), plus a failing-first test for the original defect: a slow lsof no longer makes a healthy daemon unknown; (3) earn the ratchets with scoped blesses only (uv run oo-ratchet oo --rebaseline-files <one file> --source PL-1497 --reason "..." src/punt_vox/, one file per call; coupling likewise; suppressions --relax only with a justification); never hand-edit the baseline JSON; (4) make check-comments bans ticket ids in .py prose; (5) proof: uv run pytest -q -p no:cacheprovider -n 2 over the service test files and tests/test_cli.py, then the real entry point: make install, vox daemon restart, vox daemon status (paste the line), and vox daemon status while a slow lsof is simulated if the design makes that possible from a test (otherwise state why not). Machine load rule (Jim): never make check or make test; pytest only with -n 2 after uptime shows a 1-minute load under 40; wait otherwise. Never read ~/.punt-labs identity or secret directories, never edit .punt-labs/vox/vox.md or vox.local.md. Time box 90 minutes; first commit within 30 minutes.'
